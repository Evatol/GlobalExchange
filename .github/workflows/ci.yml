name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    name: Pruebas unitarias (PUN)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Global_Exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-insecure-key-solo-para-tests
      DEBUG: "True"
      DB_NAME: Global_Exchange
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chequeo del proyecto (manage.py check)
        run: python manage.py check

      - name: Pruebas unitarias
        run: python manage.py test --verbosity 2

  docs:
    name: Documentacion Sphinx (PDO)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: Global_Exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-insecure-key-solo-para-tests
      DEBUG: "True"
      DB_NAME: Global_Exchange
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Sphinx/autodoc documenta el valor de atributos de clase como
      # ``queryset = Moneda.objects.all()...`` en los ViewSets: para eso
      # llama a repr() sobre el QuerySet, lo que dispara una consulta SQL
      # real. Sin una base migrada, el build de docs falla (esto es lo que
      # rompia este job antes: no habia Postgres disponible).
      - name: Migrar la base de datos
        run: python manage.py migrate --noinput

      - name: Build de la documentacion (falla si hay warnings)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
