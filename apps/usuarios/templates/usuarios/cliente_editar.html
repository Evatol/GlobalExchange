<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalExchange - Editar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{% url 'menu_principal' %}">GlobalExchange</a>
            <div class="d-flex align-items-center text-white">
                <span class="me-3">Bienvenido, <strong>{{ usuario.username }}</strong></span>
                <a href="{% url 'gestion_clientes' %}" class="btn btn-outline-light btn-sm">Volver al listado</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center mb-4">
                    <h2>Editar Cliente</h2>
                    <p class="text-muted">{{ cliente.nombre }} ({{ cliente.documento }})</p>
                </div>

                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        {% if error %}
                            <div class="alert alert-danger py-2">{{ error }}</div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" name="nombre" class="form-control" value="{{ cliente.nombre }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Documento / RUC</label>
                                <input type="text" name="documento" class="form-control" value="{{ cliente.documento }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tipo</label>
                                <select name="tipo" class="form-select" required>
                                    {% for valor, etiqueta in tipo_choices %}
                                    <option value="{{ valor }}" {% if cliente.tipo == valor %}selected{% endif %}>{{ etiqueta }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Razón social <small class="text-muted">(obligatoria si es jurídica)</small></label>
                                <input type="text" name="razon_social" class="form-control" value="{{ cliente.razon_social }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoría</label>
                                <select name="categoria" class="form-select">
                                    {% for valor, etiqueta in categoria_choices %}
                                    <option value="{{ valor }}" {% if cliente.categoria == valor %}selected{% endif %}>{{ etiqueta }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Preferencia de tipo de cambio</label>
                                <select name="preferencia_tipo_cambio" class="form-select">
                                    {% for valor, etiqueta in preferencia_choices %}
                                    <option value="{{ valor }}" {% if cliente.preferencia_tipo_cambio == valor %}selected{% endif %}>{{ etiqueta }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Límite de compra</label>
                                <input type="number" step="0.01" name="limite_compra" class="form-control" value="{{ cliente.limite_compra }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Límite de venta</label>
                                <input type="number" step="0.01" name="limite_venta" class="form-control" value="{{ cliente.limite_venta }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Frecuencia de transacciones</label>
                                <input type="number" name="frecuencia_transacciones" class="form-control" value="{{ cliente.frecuencia_transacciones }}">
                            </div>
                            <div class="form-check mb-3">
                                <input type="checkbox" name="estado" class="form-check-input" id="estadoCliente" {% if cliente.estado %}checked{% endif %}>
                                <label class="form-check-label" for="estadoCliente">Activo</label>
                            </div>
                            <div class="d-flex gap-2">
                                <a href="{% url 'gestion_clientes' %}" class="btn btn-outline-secondary w-100">Cancelar</a>
                                <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
