<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado - GlobalExchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 w-100" style="max-width: 34rem">
            <div class="card-body text-center p-5">
                <p class="text-uppercase text-muted small mb-1">{{ terminal.nombre }}</p>
                <h1 class="h4">No se puede continuar</h1>
                <div class="alert alert-danger" role="alert">{{ mensaje }}</div>
                <a href="{% url 'terminal_demo' terminal.pk %}" class="btn btn-outline-primary">Volver al kiosco</a>
            </div>
        </div>
    </main>
</body>
</html>
