<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ terminal.nombre }} - GlobalExchange</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 w-100" style="max-width: 34rem">
            <div class="card-body text-center p-5">
                <p class="text-uppercase text-muted small mb-1">GlobalExchange Autoservicio</p>
                <h1 class="h3">{{ terminal.nombre }}</h1>
                <p class="text-muted">{{ terminal.sucursal.nombre }}</p>
                {% if error %}
                    <div class="alert alert-warning" role="alert">{{ error }}</div>
                    <p class="mb-0">No es posible iniciar una operación en este momento.</p>
                {% elif mensaje %}
                    <div class="alert alert-success" role="status">{{ mensaje }}</div>
                {% else %}
                    <form method="post">
                        {% csrf_token %}
                        <button class="btn btn-primary btn-lg w-100" type="submit">Iniciar operación</button>
                    </form>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
