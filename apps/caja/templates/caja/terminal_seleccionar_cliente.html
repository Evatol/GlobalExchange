<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar cliente - {{ terminal.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 w-100" style="max-width: 34rem">
            <div class="card-body p-4">
                <p class="text-uppercase text-muted small mb-1">{{ terminal.nombre }}</p>
                <h1 class="h4">Elegí el cliente para operar</h1>
                <form method="post">
                    {% csrf_token %}
                    <label for="cliente" class="form-label">Cliente activo</label>
                    <select id="cliente" name="cliente" class="form-select mb-3" required>
                        <option value="">Seleccioná un cliente...</option>
                        {% for cliente in clientes %}
                            <option value="{{ cliente.pk }}">{{ cliente.nombre }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-primary w-100">Continuar</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
